<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nora &amp; Wictor – RSVP</title>
<meta name="description" content="Nora and Wictor are getting married. Let us know if you can join us.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #22304A;
    --ink-soft: #4A5670;
    --sky: #EAF0F4;
    --paper: #FCFDFD;
    --cornflower: #4F6FA8;
    --meadow: #6E8B5E;
    --meadow-light: #98AE84;
    --buttercup: #D9B44A;
    --line: #C9D4DE;
    --serif: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --script: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--sky);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 1.2rem;
    line-height: 1.65;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  a { color: var(--cornflower); }
  :focus-visible { outline: 2px solid var(--cornflower); outline-offset: 3px; }

  /* ---------- Hero ---------- */
  .hero {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: calc(3rem + env(safe-area-inset-top, 0px)) 1.5rem 3rem;
  }
  .wreath { width: min(78vw, 360px); height: auto; overflow: visible; }
  .names {
    font-family: var(--script);
    font-weight: 400;
    font-size: clamp(3rem, 11vw, 5.5rem);
    line-height: 1.1;
    margin: 1.25rem 0 0;
    color: var(--ink);
  }
  .tagline {
    font-style: italic;
    font-size: clamp(1.25rem, 3.5vw, 1.6rem);
    color: var(--ink-soft);
    margin: .25rem 0 1.75rem;
  }
  .when-where {
    font-size: clamp(1.15rem, 3vw, 1.35rem);
    letter-spacing: .02em;
    margin: 0 0 2.25rem;
  }
  .when-where strong { font-weight: 600; display: block; font-size: 1.15em; }

  .button {
    display: inline-block;
    font-family: var(--serif);
    font-size: 1.15rem;
    font-weight: 500;
    letter-spacing: .04em;
    color: var(--paper);
    background: var(--cornflower);
    border: none;
    border-radius: 999px;
    padding: .8rem 2.4rem;
    text-decoration: none;
    cursor: pointer;
    transition: background .2s ease;
  }
  .button:hover { background: var(--ink); }

  /* ---------- Sections ---------- */
  section.block {
    max-width: 52rem;
    margin: 0 auto;
    padding: 4.5rem 1.5rem;
  }
  h2 {
    font-family: var(--script);
    font-weight: 400;
    font-size: clamp(2.4rem, 7vw, 3.4rem);
    text-align: center;
    margin: 0 0 2.5rem;
    line-height: 1.2;
  }
  .sprig { display: block; margin: 0 auto 1rem; width: 70px; height: auto; }

  /* Details */
  .details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem 3rem;
    text-align: center;
  }
  .details h3 {
    font-weight: 500;
    font-size: 1.5rem;
    margin: 0 0 .5rem;
  }
  .details p { margin: 0; color: var(--ink-soft); }
  .details .time { font-style: italic; color: var(--cornflower); font-size: 1.25rem; }
  .note {
    max-width: 34rem;
    margin: 3rem auto 0;
    text-align: center;
    font-style: italic;
    color: var(--ink-soft);
  }

  /* Schedule */
  .schedule {
    list-style: none;
    margin: 0 auto;
    padding: 0;
    max-width: 30rem;
    position: relative;
  }
  .schedule::before {
    content: "";
    position: absolute;
    left: 5.25rem;
    top: .9rem;
    bottom: .9rem;
    width: 1px;
    background: var(--line);
  }
  .schedule li {
    display: grid;
    grid-template-columns: 4.5rem 1.5rem 1fr;
    align-items: baseline;
    padding: .7rem 0;
  }
  .schedule .t { font-style: italic; color: var(--cornflower); text-align: right; font-size: 1.25rem; }
  .schedule .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--buttercup);
    justify-self: center;
    position: relative; top: -2px;
    box-shadow: 0 0 0 4px var(--sky);
  }
  .schedule .what { font-size: 1.3rem; }
  .schedule .what span { display: block; font-size: 1.05rem; color: var(--ink-soft); }

  /* RSVP */
  .rsvp-wrap { padding-bottom: 6rem; }
  .card {
    background: var(--paper);
    max-width: 36rem;
    margin: 0 auto;
    padding: clamp(2rem, 6vw, 3.5rem);
    border-radius: 4px;
    border: 1px solid var(--line);
    position: relative;
  }
  .card::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--line);
    border-radius: 2px;
    pointer-events: none;
  }
  .card > * { position: relative; z-index: 1; }
  .deadline { text-align: center; font-style: italic; color: var(--ink-soft); margin: -1.5rem 0 2rem; }

  .rsvp-text { text-align: center; max-width: 26rem; margin: 0 auto; color: var(--ink-soft); }
  .submit-row { text-align: center; margin-top: 2.2rem; }
  .button.soon { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); cursor: default; }

  footer {
    text-align: center;
    padding: 0 1.5rem 3rem;
    color: var(--ink-soft);
    font-style: italic;
  }
  footer .mono { font-family: var(--script); font-style: normal; font-size: 2.2rem; color: var(--ink); display: block; }

  /* ---------- The wreath grows in ---------- */
  .stem { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 2.2s ease-out .2s forwards; }
  .bloom
